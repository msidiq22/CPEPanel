name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${{ github.ref_name || format('v{0}', github.run_number) }}"
          SAFE_VERSION_TAG="${VERSION_TAG//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/CPEPanel-${SAFE_VERSION_TAG}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPEPanel-APK
          path: release-artifacts/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.run_number) }}
          name: Release ${{ github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
